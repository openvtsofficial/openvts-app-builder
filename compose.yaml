services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openvts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvts}
      POSTGRES_DB: openvts_app_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvts -d openvts_app_studio"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openvts:${POSTGRES_PASSWORD:-openvts}@db:5432/openvts_app_studio
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY}
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /app/data
      FLUTTER_TEMPLATE_ROOT: /app/templates/flutter_base
      BUILD_WORKSPACE_ROOT: /app/data/workspaces
      BUILD_ARTIFACT_ROOT: /app/data/artifacts
      FLUTTER_BIN: /opt/flutter/bin/flutter
      BUILD_POLL_INTERVAL_MS: "3000"
      BUILD_TIMEOUT_MS: "1200000"
    volumes:
      - appdata:/app/data
    ports:
      - "${APP_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    networks:
      - internal
      - web

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "--import=tsx", "worker/build-worker.ts"]
    environment:
      DATABASE_URL: postgresql://openvts:${POSTGRES_PASSWORD:-openvts}@db:5432/openvts_app_studio
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /app/data
      FLUTTER_TEMPLATE_ROOT: /app/templates/flutter_base
      BUILD_WORKSPACE_ROOT: /app/data/workspaces
      BUILD_ARTIFACT_ROOT: /app/data/artifacts
      FLUTTER_BIN: /opt/flutter/bin/flutter
      BUILD_POLL_INTERVAL_MS: "5000"
      BUILD_TIMEOUT_MS: "1200000"
    volumes:
      - appdata:/app/data
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    networks:
      - internal

volumes:
  pgdata:
  appdata:

networks:
  internal:
    driver: bridge
  web:
    external: true
