name: Security Scanning
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Generate security report
        run: |
          npm audit --json > audit-report.json || true
          echo "Audit report generated"
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          if-no-files-found: warn

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Secret Scanning
        uses: trufflesecurity/trufflehog@latest
        with:
          extra_args: --regex --entropy=False --max_depth=5
      
      - name: Check for sensitive files
        run: |
          # Check for common sensitive files
          sensitive_files=(
            ".env"
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "credentials.json"
            "service-account.json"
          )
          
          for pattern in "${sensitive_files[@]}"; do
            if find . -name "$pattern" -type f | grep -q "."; then
              echo "⚠️  Found sensitive file pattern: $pattern"
              find . -name "$pattern" -type f
            fi
          done
      
      - name: Check for hardcoded secrets
        run: |
          # Simple regex pattern for common secrets
          patterns=(
            "password\s*[:=]\s*[\"'][^\"']{8,}[\"']"
            "secret\s*[:=]\s*[\"'][^\"']{8,}[\"']"
            "api[_-]?key\s*[:=]\s*[\"'][^\"']{8,}[\"']"
            "mongodb[+]srv://[^:@]+:[^@]+@"
            "postgresql://[^:@]+:[^@]+@"
          )
          
          for pattern in "${patterns[@]}"; do
            echo "Checking pattern: $pattern"
            grep -rI --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" "$pattern" . || true
          done

  container-scanning:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openvts-app-builder:security-scan
      
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'openvts-app-builder:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, dependency-audit, secret-scanning, container-scanning]
    steps:
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary"
          echo "## Completed Scans:"
          echo "- ✅ CodeQL Analysis"
          echo "- ✅ Dependency Vulnerability Scan"
          echo "- ✅ Secret Scanning"
          echo "- ✅ Container Security Scan"
          echo ""
          echo "All security scans completed successfully."
          echo ""
          echo "**Next Steps:**"
          echo "1. Review any findings in the respective reports"
          echo "2. Fix critical vulnerabilities immediately"
          echo "3. Address high severity issues in the next sprint"
          echo "4. Monitor weekly scans for new vulnerabilities"