name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://openvts:openvts@localhost:5432/openvts_app_studio
      AUTH_SECRET: ci-test-secret-not-real-0123456789ab
      SIGNING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LOGGER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client and prepare directories
        run: |
          npx prisma generate
          npm run setup
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Deployment success and rollback tests
        run: npm run test:deploy
      - name: Validate workflow and deployment script
        run: |
          bash -n scripts/deploy-studio.sh scripts/ci-deploy.sh
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLo /tmp/actionlint-checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          cp /tmp/actionlint.tar.gz /tmp/actionlint_1.7.12_linux_amd64.tar.gz
          (cd /tmp && grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint-checksums.txt | sha256sum --check)
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  build:
    name: Build & Verify Production Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish-ref.outputs.image }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openvts
          POSTGRES_PASSWORD: openvts
          POSTGRES_DB: openvts_app_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openvts -d openvts_app_studio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openvts:openvts@127.0.0.1:5432/openvts_app_studio
      AUTH_SECRET: ci-test-secret-not-real-0123456789ab
      NEXT_PUBLIC_DEMO_MODE: "false"
      LOGGER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for the Android toolchain on the disposable CI runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Set image names
        id: names
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "local=studio-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.names.outputs.local }}
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=studio-node24-flutter3448
          cache-to: type=gha,mode=max,scope=studio-node24-flutter3448,ignore-error=true
      - name: Verify migrations, runtime and production HTTP behavior
        env:
          TEST_IMAGE: ${{ steps.names.outputs.local }}
        run: |
          docker run --rm --network host --memory 512m --cpus 1 -e DATABASE_URL --entrypoint node "$TEST_IMAGE" node_modules/prisma/build/index.js migrate deploy
          docker run --rm --network host --memory 512m --cpus 1 -e DATABASE_URL -e NEXT_PUBLIC_DEMO_MODE -e LOGGER_ENABLED --entrypoint node "$TEST_IMAGE" --import=tsx scripts/deployment-probe.mjs
          trap 'docker rm -f studio-ci-web >/dev/null 2>&1 || true' EXIT
          docker run -d --name studio-ci-web --network host --memory 512m --cpus 1 -e DATABASE_URL -e AUTH_SECRET -e NEXT_PUBLIC_DEMO_MODE -e LOGGER_ENABLED "$TEST_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/health > /tmp/studio-health.json; then break; fi
            echo "Waiting for the test web server: attempt $attempt/30"
            sleep 2
          done
          python3 -c 'import json; h=json.load(open("/tmp/studio-health.json")); assert h["status"] == "ok" and h["mode"] == "production"'
          status=$(curl --silent --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/projects)
          test "$status" = 401
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified production image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.repository }}:sha-${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=studio-node24-flutter3448
      - name: Record immutable image reference
        id: publish-ref
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TEST_IMAGE: ${{ steps.names.outputs.local }}
        run: |
          image="${REPOSITORY}@${DIGEST}"
          docker pull "$image"
          tested=$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")
          published=$(docker image inspect --format '{{.Id}}' "$image")
          test "$tested" = "$published"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Studio to AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      EC2_USER: ${{ secrets.AWS_EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.AWS_EC2_KNOWN_HOSTS }}
      DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require deployment credentials
        run: |
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS DEPLOY_IMAGE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Deployment must not be silently skipped."
              exit 1
            fi
          done
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy exact image over verified SSH
        run: bash scripts/ci-deploy.sh
