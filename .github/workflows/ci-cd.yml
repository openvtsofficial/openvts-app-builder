name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_NAME: "OpenVTS App Studio"
      NEXT_PUBLIC_APP_URL: "http://localhost:8082"
      NEXT_PUBLIC_DEMO_MODE: "true"
      NODE_ENV: "test"
      DATABASE_URL: "postgresql://openvts:openvts@localhost:5432/openvts_app_studio"
      AUTH_SECRET: "ci-test-secret-not-real-0123456789ab"
      AUTH_GOOGLE_ID: "ci-placeholder"
      AUTH_GOOGLE_SECRET: "ci-placeholder"
      SIGNING_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      LOGGER_ENABLED: "false"
      LOGGER_LEVEL: "error"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Extract Flutter template (needed by tests)
        run: npm run setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build & Docker Image
    runs-on: ubuntu-latest
    needs: ci
    env:
      NEXT_PUBLIC_APP_NAME: "OpenVTS App Studio"
      NEXT_PUBLIC_APP_URL: "http://localhost:8082"
      NEXT_PUBLIC_DEMO_MODE: "true"
      DATABASE_URL: "postgresql://openvts:openvts@localhost:5432/openvts_app_studio"
      AUTH_SECRET: "ci-test-secret-not-real-0123456789ab"
      AUTH_GOOGLE_ID: "ci-placeholder"
      AUTH_GOOGLE_SECRET: "ci-placeholder"
      SIGNING_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    permissions:
      contents: read
      packages: write
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Verify standalone output
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone not found"
            exit 1
          fi
          echo "Standalone build OK"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      EC2_USER: ${{ secrets.AWS_EC2_USER }}
      DOCKER_IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Check deployment secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AWS_EC2_HOST }}" ] || [ -z "${{ secrets.AWS_EC2_SSH_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Deployment secrets not configured — skipping deploy."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: steps.check-secrets.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying OpenVTS App Studio ==="

            cd /opt/studio/app

            echo "Pulling latest code..."
            git pull origin main

            echo "Ensuring .env file exists..."
            if [ ! -f .env ]; then
              if [ -f .env.production ]; then
                cp .env.production .env
                echo ".env created from .env.production"
              else
                echo "WARNING: No .env file found"
              fi
            fi

            echo "Pulling latest Docker image from GHCR..."
            docker compose -f docker-compose.prod.yml pull

            echo "Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Running database migrations..."
            sleep 5
            docker exec studio-openvts npx prisma migrate deploy || echo "Migrations skipped (no pending)"

            echo "Verifying containers..."
            docker ps --filter "name=studio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== Deployment complete ==="

      - name: Health check
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          echo "Waiting for application to start..."
          sleep 10
          for i in $(seq 1 10); do
            STATUS=$(curl -f -s -o /dev/null -w "%{http_code}" "https://studio.openvts.io/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 - status $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1
