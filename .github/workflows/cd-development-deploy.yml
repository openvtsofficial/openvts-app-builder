name: Development Deployment
on:
  push:
    branches: [development]
  workflow_dispatch: # Allow manual triggering

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-development:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup SSH for deployment
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVELOPMENT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        
      - name: Cleanup SSH (Post-job)
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
      
      - name: Deploy to development server
        run: |
          echo "Deploying to development environment..."
          echo "Latest image tag: ${{ needs.build-and-push.outputs.image_tag }}"
          
          # Example deployment commands (customize based on your setup)
          # ssh user@dev-server "
          #   cd /opt/studio
          #   docker compose pull
          #   docker compose up -d
          #   docker compose exec app npx prisma migrate deploy
          # "
          echo "Development deployment would happen here"
      
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
        run: |
          echo "Running database migrations..."
          # Example: npx prisma migrate deploy --schema=./prisma/schema.prisma
          echo "Database migrations would run here"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-development
    environment: development
    
    steps:
      - name: Check application health
        run: |
          echo "Performing health checks..."
          # Example health check commands
          # curl -f http://dev-server:8082/api/health || exit 1
          # curl -f http://dev-server:8082/api/auth/session || exit 1
          echo "Development deployment health check would happen here"
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Example smoke tests
          echo "1. Test API endpoints"
          echo "2. Test authentication flow"
          echo "3. Test database connectivity"
          echo "Smoke tests completed successfully"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-development, health-check]
    if: always()
    
    steps:
      - name: Determine deployment status
        id: check-status
        run: |
          if [ "${{ needs.deploy-development.result }}" == "success" ] && [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "message=✅ Development deployment completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "message=❌ Development deployment failed" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.check-status.outputs.status }}
          text: ${{ steps.check-status.outputs.message }}
          channel: '#deployments'
          username: 'GitHub Actions'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Create deployment summary
        if: always()
        run: |
          echo "# Development Deployment Summary"
          echo ""
          echo "**Timestamp:** $(date)"
          echo "**Commit:** ${{ github.sha }}"
          echo "**Branch:** ${{ github.ref }}"
          echo "**Actor:** ${{ github.actor }}"
          echo ""
          echo "## Build Status: ${{ needs.build-and-push.result }}"
          echo "## Deployment Status: ${{ needs.deploy-development.result }}"
          echo "## Health Check Status: ${{ needs.health-check.result }}"
          echo ""
          echo "## Docker Image:"
          echo "- Repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "- Tags: ${{ needs.build-and-push.outputs.image_tag }}"
          echo ""
          echo "## Next Steps:"
          echo "1. Verify deployment at: http://dev-studio.openvts.io"
          echo "2. Review logs if any issues"
          echo "3. Test critical workflows"