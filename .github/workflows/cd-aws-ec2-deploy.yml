name: AWS EC2 Deployment
on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deployment

env:
  EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
  EC2_USER: ${{ secrets.AWS_EC2_USER }}
  APP_NAME: openvts-app-builder
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-docker-image
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts
        
      - name: Cleanup SSH (Post-job)
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
      
      - name: Deployment Configuration
        run: |
          echo "Deploying to: ${{ env.EC2_USER }}@${{ env.EC2_HOST }}"
          echo "Application: ${{ env.APP_NAME }}"
          echo "Docker Image: ${{ needs.build-docker-image.outputs.image_tag }}"
          echo "Git SHA: ${{ github.sha }}"
      
      - name: Check current deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "=== Current Deployment Status ==="
            echo "Server: $(hostname)"
            echo "Date: $(date)"
            echo ""
            echo "--- Active Containers ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
            echo "--- studio.openvts.io Container ---"
            docker ps --filter "name=studio-openvts" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
            echo ""
            echo "--- Available Images ---"
            docker images openvts-app-builder --format "table {{.Repository}}\t{{.Tag}}"
            echo ""
            echo "--- Saving current image for rollback ---"
            CURRENT_IMAGE=$(docker ps --filter "name=studio-openvts" --format "{{.Image}}" | head -1)
            if [ -n "$CURRENT_IMAGE" ]; then
              echo "Current image: $CURRENT_IMAGE"
              echo "$CURRENT_IMAGE" > /tmp/previous-image.txt
            else
              echo "No running container found"
            fi
      
      - name: Deploy Application
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Create/ensure directory exists
            sudo mkdir -p /opt/studio
            sudo chown $USER:$USER /opt/studio
            cd /opt/studio
            
            # Create or update docker-compose.yml
            cat > docker-compose.studio.yml << 'EOF'
            version: '3.8'
            services:
              studio:
                image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${{ needs.build-docker-image.outputs.image_tag }}
                container_name: studio-openvts
                restart: unless-stopped
                ports:
                  - "8082:8082"
                environment:
                  - DATABASE_URL=postgresql://studio_app:StudioApp123@postgres:5432/openvts_app_studio?schema=public
                  - NODE_ENV=production
                  - PORT=8082
                  - NEXT_PUBLIC_APP_URL=https://studio.openvts.io
                  - AUTH_SECRET=${{ secrets.AUTH_SECRET }}
                  - AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
                  - AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
                  - STORAGE_DRIVER=local
                  - LOCAL_STORAGE_ROOT=/app/data
                volumes:
                  - studio-workspaces:/app/data/workspaces
                  - studio-artifacts:/app/data/artifacts
                  - studio-templates:/app/templates/flutter_base
                networks:
                  - compose_openvts
            
            volumes:
              studio-workspaces:
              studio-artifacts:
              studio-templates:
            
            networks:
              compose_openvts:
                external: true
                name: compose_openvts
            EOF
            
            echo "📦 Pulling new Docker image..."
            docker compose -f docker-compose.studio.yml pull
            
            echo "🔄 Stopping existing container..."
            docker compose -f docker-compose.studio.yml down || true
            
            echo "🚀 Starting new container..."
            docker compose -f docker-compose.studio.yml up -d
            
            echo "⏳ Waiting for container to start..."
            sleep 10
            
            echo "🔍 Checking container status..."
            docker ps --filter "name=studio-openvts" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Check if container started successfully
            if ! docker ps --filter "name=studio-openvts" --filter "status=running" --quiet; then
              echo "❌ Container failed to start. Attempting rollback..."
              if [ -f /tmp/previous-image.txt ]; then
                PREVIOUS_IMAGE=$(cat /tmp/previous-image.txt)
                echo "Rolling back to previous image: $PREVIOUS_IMAGE"
                sed -i "s|image:.*|image: $PREVIOUS_IMAGE|" docker-compose.studio.yml
                docker compose -f docker-compose.studio.yml up -d
                echo "✅ Rollback completed"
              else
                echo "⚠️ No previous image found for rollback"
              fi
              exit 1
            fi

      - name: Run Database Migrations
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "🗃️ Running database migrations..."
            cd /opt/studio
            
            # Run Prisma migrations inside the container with retry logic
            echo "Attempting database migrations..."
            for i in {1..3}; do
              if docker exec studio-openvts npx prisma migrate deploy; then
                echo "✅ Migrations applied successfully"
                break
              elif [ $i -eq 3 ]; then
                echo "⚠️ Migrations failed after 3 attempts. Continuing deployment..."
                docker exec studio-openvts npx prisma migrate status || echo "Migration status check failed"
              else
                echo "⚠️ Migration attempt $i failed, retrying in 5 seconds..."
                sleep 5
              fi
            done
            
            echo "✅ Database migrations completed"
      
      - name: Verify Nginx Configuration
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "🔍 Verifying Nginx configuration..."
            
            # Test Nginx configuration
            sudo nginx -t
            
            # Check studio.openvts.io SSL certificate
            echo ""
            echo "📋 SSL Certificate Status:"
            sudo openssl x509 -in /etc/letsencrypt/live/studio.openvts.io/fullchain.pem -noout -dates
            
            # Reload Nginx to ensure latest config
            echo ""
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Nginx configuration verified"

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    environment: production
    
    steps:
      - name: Health Check - Through Nginx/SSL
        run: |
          echo "🔍 Checking application health through Nginx/SSL..."
          # Health check through Nginx with SSL
          HEALTH_URL="https://studio.openvts.io/api/health"
          echo "Testing: $HEALTH_URL"
          
          # Using curl with timeout and retry logic
          for i in {1..10}; do
            STATUS_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            else
              echo "⏳ Health check failed with status $STATUS_CODE, retrying in 5 seconds (attempt $i/10)..."
              sleep 5
            fi
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1
      
      - name: Test Application Endpoints
        run: |
          echo "🧪 Testing application endpoints..."
          
          # Test basic page load through domain
          curl -s -o /dev/null -w "Homepage via domain: %{http_code}\n" "https://studio.openvts.io" || true
          
          # Test API endpoint through domain
          curl -s -o /dev/null -w "API Health via domain: %{http_code}\n" "https://studio.openvts.io/api/health" || true
          
          echo "✅ Basic endpoint tests completed"

      - name: Check Container Logs
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            echo "📋 Checking container logs..."
            docker logs studio-openvts --tail 20
            
            echo ""
            echo "📊 Container resource usage:"
            docker stats studio-openvts --no-stream || true

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-docker-image, deploy-to-ec2, verify-deployment]
    if: always()
    
    steps:
      - name: Generate Deployment Report
        run: |
          echo "# AWS EC2 Deployment Report"
          echo ""
          echo "## Deployment Details"
          echo "- **Server:** ${{ env.EC2_USER }}@${{ env.EC2_HOST }}"
          echo "- **Application:** ${{ env.APP_NAME }}"
          echo "- **Commit:** ${{ github.sha }}"
          echo "- **Branch:** ${{ github.ref }}"
          echo "- **Deploy Time:** $(date -u)"
          echo "- **Triggered By:** ${{ github.actor }}"
          echo ""
          echo "## Build Status"
          echo "- **Docker Build:** ${{ needs.build-docker-image.result }}"
          echo "- **Image Tag:** ${{ needs.build-docker-image.outputs.image_tag }}"
          echo "- **Registry:** ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}"
          echo ""
          echo "## Deployment Status"
          echo "- **Deployment:** ${{ needs.deploy-to-ec2.result }}"
          echo "- **Verification:** ${{ needs.verify-deployment.result }}"
          echo ""
          echo "## Application URLs"
          echo "- **Direct Container Access:** http://${{ env.EC2_HOST }}:8082"
          echo "- **Domain Access:** https://studio.openvts.io"
          echo "- **Health Check:** https://studio.openvts.io/api/health"
          echo ""
          echo "## Next Steps"
          echo "1. Verify deployment at https://studio.openvts.io"
          echo "2. Check container logs for any errors"
          echo "3. Test critical user workflows"
          echo "4. Monitor application performance"
          echo ""
          echo "## Rollback Instructions"
          echo "If deployment fails, SSH to server and run:"
          echo "```bash"
          echo "cd /opt/studio"
          echo "docker compose -f docker-compose.studio.yml down"
          echo "# Restore from backup or use previous image"
          echo "```"
      
      - name: Update Deployment Status
        if: always()
        run: |
          if [ "${{ needs.verify-deployment.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed or encountered issues"
            exit 1
          fi