services:
  app:
    build: .
    image: studio-openvts:latest
    container_name: studio-openvts
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      DATABASE_URL: postgresql://studio_app:StudioApp321@openvts-postgres:5432/openvts_app_studio?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_URL: https://studio.openvts.io
      NEXTAUTH_URL: https://studio.openvts.io
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_APP_URL: https://studio.openvts.io
      NODE_ENV: production
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /app/data
      FLUTTER_TEMPLATE_ROOT: /app/templates/flutter_base
      BUILD_WORKSPACE_ROOT: /app/data/workspaces
      BUILD_ARTIFACT_ROOT: /app/data/artifacts
      FLUTTER_BIN: /opt/flutter/bin/flutter
      BUILD_POLL_INTERVAL_MS: "3000"
      BUILD_TIMEOUT_MS: "1200000"
      LOGGER_ENABLED: "true"
      LOGGER_LEVEL: "info"
      LOG_FILE_PATH: /app/data/logs/app.log
      DISABLE_EMBEDDED_WORKER: "true"
    volumes:
      - studio-data:/app/data
    networks:
      - compose_openvts
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  worker:
    build: .
    image: studio-openvts:latest
    container_name: studio-worker
    restart: unless-stopped
    command: ["node", "--import=tsx", "worker/build-worker.ts"]
    environment:
      DATABASE_URL: postgresql://studio_app:StudioApp321@openvts-postgres:5432/openvts_app_studio?schema=public
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /app/data
      FLUTTER_TEMPLATE_ROOT: /app/templates/flutter_base
      BUILD_WORKSPACE_ROOT: /app/data/workspaces
      BUILD_ARTIFACT_ROOT: /app/data/artifacts
      FLUTTER_BIN: /opt/flutter/bin/flutter
      BUILD_POLL_INTERVAL_MS: "5000"
      BUILD_TIMEOUT_MS: "1200000"
      LOGGER_ENABLED: "true"
      LOGGER_LEVEL: "info"
      LOG_FILE_PATH: /app/data/logs/worker.log
    volumes:
      - studio-data:/app/data
    networks:
      - compose_openvts
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

volumes:
  studio-data:

networks:
  compose_openvts:
    external: true
    name: compose_openvts
